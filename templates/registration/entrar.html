{% extends "base.html" %}
{% block clase_body %}simple{% endblock %}
{% block contenido %}
<section class="tarjeta angosta">
  <h1>Entrar</h1>
  <form method="post" novalidate>
    {% csrf_token %}
    {% if form.non_field_errors %}<p class="error">Correo o contraseña incorrectos.</p>{% endif %}
    <label for="id_username">Correo</label>
    {{ form.username }}
    <label for="id_password">Contraseña</label>
    {{ form.password }}
    <input type="hidden" name="next" value="{{ next }}">
    <button class="boton grande">Entrar</button>
  </form>
  <p><a href="{% url 'recuperar' %}">Olvidé mi contraseña</a></p>
</section>
{% endblock %}
