{% extends "base.html" %}
{% block clase_body %}simple{% endblock %}
{% block contenido %}
<p><a href="{{ m.volver }}">← Volver al documento</a></p>
<section class="tarjeta angosta">
  <h1>Firmar</h1>
  <p><strong>{{ m.titulo }}</strong></p>
  {% if m.archivo_url %}<p><a href="{{ m.archivo_url }}" target="_blank" rel="noopener">Abrir el documento</a></p>{% endif %}
  <p class="ayuda">{{ texto }}</p>
  <form method="post">{% csrf_token %}
    <input type="hidden" name="accion" value="firmar">
    <input type="hidden" name="huella" value="{{ huella }}">
    <label class="casilla"><input type="checkbox" name="acepto" value="1" required> Leí el documento y acepto firmarlo electrónicamente.</label>
    <button class="boton grande">Firmar</button>
  </form>
</section>
{% endblock %}
